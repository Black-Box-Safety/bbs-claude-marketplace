name: Refresh model IDs

# The model list is a canonical fact with a checker enforcing it. Left to humans it went
# stale in both places at once — the list said claude-opus-4-8 and the checker told authors
# to write it. This asks the API weekly and opens a PR when the answer changes, so the fact
# ages on Anthropic's release schedule rather than on someone remembering.
#
# Requires the repository secret ANTHROPIC_API_KEY. Without it the job fails loudly with
# instructions rather than skipping quietly — a quiet skip is how this went stale before.

on:
  schedule:
    - cron: "0 16 * * 1"   # Mondays 16:00 UTC — 9am Pacific, so a PR is waiting at the week's start
  workflow_dispatch:        # and on demand, e.g. the day a release is announced

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Anthropic SDK
        run: pip install --quiet anthropic

      - name: Fail early if the key is missing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set for this repository."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            echo "Until then the model list is hand-maintained — which is what this job exists to stop."
            exit 1
          fi

      - name: Refresh models.json
        id: refresh
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e
          python3 plugins/bbs-foundations/skills/bbs-claude-md-forge/scripts/refresh_models.py | tee /tmp/refresh.log
          code=${PIPESTATUS[0]}
          set -e
          # 0 = already current · 1 = rewritten · 2 = could not reach the API
          case "$code" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "changed=true"  >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::could not reach the Models API; models.json left unchanged"; exit 1 ;;
          esac

      - name: Open a PR
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/refresh-model-ids-$(date +%Y-%m-%d)"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "$branch already exists — an earlier run opened this PR."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add plugins/bbs-foundations/skills/bbs-claude-md-forge/references/models.json
          {
            echo "chore: refresh canonical model IDs from the Models API"
            echo
            cat /tmp/refresh.log
            echo
            echo "Generated by .github/workflows/refresh-models.yml."
          } > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push -u origin "$branch"

          {
            echo "The Models API now reports a different current model than \`models.json\` held."
            echo
            echo '```'
            cat /tmp/refresh.log
            echo '```'
            echo
            echo "\`check_claude_md.py\` reads this file, so merging changes what the checker"
            echo "enforces: every CLAUDE.md naming the previous ID starts failing. That is the point."
            echo
            echo "**Before merging,** update the prose that quotes the list — only the data file is generated:"
            echo
            echo "- \`plugins/bbs-foundations/skills/bbs-claude-md-forge/references/canonical-facts.md\` — the Model IDs section"
            echo "- \`README.md\` — the Models bullet"
            echo
            echo "Then run the checker to see what the change catches:"
            echo
            echo '```bash'
            echo "python3 plugins/bbs-foundations/skills/bbs-claude-md-forge/scripts/check_claude_md.py <path>"
            echo '```'
          } > /tmp/pr-body.md

          gh pr create --title "Refresh canonical model IDs" --body-file /tmp/pr-body.md \
            || echo "::warning::branch pushed but PR creation failed — open it by hand from $branch"
