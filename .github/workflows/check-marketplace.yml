name: Marketplace invariants

# The repo's structural invariants have had a checker since PR #12 and no gate: it ran
# when an agent remembered to run it. `refresh-models.yml` is a scheduled model-ID refresh,
# not a PR check. So nothing mechanically stopped a stale model ID, an unquoted
# `description:` colon, a dangling doctrine subscription, a drifted README badge count or
# — as of this PR — an undeclared connector from reaching `main`.
#
# THIS BLOCKS. Ruled by Parker 2026-09-18 (PR #21): a FAIL from either checker fails the
# job. In this repo a non-blocking checker is an ignored checker, and the defect it misses
# is a plausible wrong number on a binding document. The earlier steps keep
# `continue-on-error` only so the job summary is still written when a check fails — a gate
# that hides the reason it fired is worse than no gate; the "Report" step is what fails.
#
# To make GitHub refuse the merge button too, add "invariants" under
# Settings -> Branches -> main -> Require status checks to pass.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The checker is deliberately stdlib + PyYAML, so this is the whole install.
      - name: Install PyYAML
        run: pip install --quiet pyyaml

      - name: Run the structural invariant checker
        id: check
        run: |
          set +e
          python3 scripts/check_marketplace.py | tee /tmp/check.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
        continue-on-error: true

      - name: Check the repo's own CLAUDE.md
        id: claudemd
        run: |
          set +e
          python3 plugins/bbs-foundations/skills/bbs-claude-md-forge/scripts/check_claude_md.py "$PWD" \
            | tee /tmp/claudemd.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
        continue-on-error: true

      # The doctrine hook ships twice, as doctrine.ps1 and doctrine.py, and the two must
      # emit identical bytes for identical input. ubuntu-latest carries pwsh, and
      # BBS_REQUIRE_PS=1 turns the test's "no PowerShell, skip" into a failure, so this
      # step proves parity rather than quietly skipping it. It fails the job directly.
      - name: Doctrine hook parity (doctrine.ps1 == doctrine.py)
        env:
          BBS_REQUIRE_PS: "1"
        run: |
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          for p in plugins/bbs-foundations plugins/bbs-website; do
            echo "== $p"
            pwsh -NoProfile -File "$p/hooks/tests/run-tests.ps1"
            python3 "$p/hooks/tests/parity.py" | tail -3
            test "${PIPESTATUS[0]}" = "0"
          done

      # The customer-folder reminder ships as customer-folder.ps1 and customer-folder.py
      # (bbs-foundations) and the two must emit identical bytes, markers and all: a Mac runs
      # the Python half, Windows the PowerShell half. Same BBS_REQUIRE_PS=1 rule as above.
      - name: Customer-folder hook parity (customer-folder.ps1 == customer-folder.py)
        env:
          BBS_REQUIRE_PS: "1"
        run: |
          python3 plugins/bbs-foundations/hooks/tests/customer_folder_parity.py | tail -3
          test "${PIPESTATUS[0]}" = "0"

      # The quote-desk guards ship as guard-tree.ps1/.py and desk-context.ps1/.py, and the two
      # halves must decide identically: a Mac runs the Python half, Windows the PowerShell half.
      # BBS_REQUIRE_PS=1 makes a missing pwsh a failure, so this proves parity rather than
      # skipping it; run-tests.ps1 is the PowerShell suite on its own.
      # The same step holds the RFQ record hook to its one-validator rule: hooks.json runs
      # python3 first, and rfq-record-hook.ps1 must only say "needs python3; this edit was not
      # checked" (parity.py and run-tests.ps1 both assert that notice).
      - name: Quote-desk guard parity (guard-tree, desk-context, rfq-record notice)
        env:
          BBS_REQUIRE_PS: "1"
        run: |
          pwsh -NoProfile -File plugins/bbs-sales/hooks/tests/run-tests.ps1
          python3 plugins/bbs-sales/hooks/tests/parity.py | tail -3
          test "${PIPESTATUS[0]}" = "0"

      # The RFQ record parser and CLI (scripts/rfq_record.py) that the record hook calls. Without
      # this step the parser could regress with every other check still green.
      - name: RFQ record parser tests
        run: python3 -m unittest discover -s plugins/bbs-sales/scripts/tests

      # Desk memory: the writer's refusals (no price, account, cert or contract fact in a note)
      # and the isolation loop (a note saved for one buyer is shown there and not in a sibling
      # folder), then the SessionStart hook's two halves against each other.
      - name: Desk memory (writer, isolation, hook parity)
        env:
          BBS_REQUIRE_PS: "1"
        run: |
          python3 plugins/bbs-sales/skills/desk-remember/scripts/test_desk_memory.py | tail -3
          test "${PIPESTATUS[0]}" = "0"
          python3 plugins/bbs-sales/hooks/tests/desk_memory_parity.py | tail -3
          test "${PIPESTATUS[0]}" = "0"

      # bbs-sales' fill-gate hook approves one launcher invocation without a prompt, so the
      # launcher's refusals are the control: every way past them is a way past auto mode. The
      # tests also fail when a skill line or packet profile names a script that is not on its
      # allow-list.
      - name: bbs-fill launcher tests
        run: python3 plugins/bbs-sales/scripts/tests/test_bbs_fill.py

      # The bbs-tools launcher stays installed, and `Bash(bbs-fill *)` stays in managed settings,
      # until PR B, so its refusal tests keep running. Only its skill-line check is skipped: skills
      # now call bbs-sales' own launcher, which the step above checks. PR B deletes this step with
      # the launcher (docs/superpowers/plans/2026-11-11-bbs-fill-into-bbs-sales.md).
      - name: bbs-tools launcher refusal tests (until PR B)
        run: |
          python3 - <<'PY'
          import importlib.util, sys, traceback
          spec = importlib.util.spec_from_file_location("t", "plugins/bbs-tools/tests/test_bbs_fill.py")
          t = importlib.util.module_from_spec(spec); spec.loader.exec_module(t)
          skip = {"test_every_bbs_fill_line_and_profile_script_is_allowed"}
          tests = [(n, f) for n, f in sorted(vars(t).items()) if n.startswith("test_") and n not in skip]
          failed = 0
          for n, f in tests:
              try:
                  f(); print("PASS", n)
              except Exception:
                  failed += 1; print("FAIL", n); traceback.print_exc()
          print("%d/%d passed (skipped: %s)" % (len(tests) - failed, len(tests), ", ".join(sorted(skip))))
          sys.exit(1 if failed else 0)
          PY

      # fill-gate.py and fill-gate.ps1 decide identically on every case, and bash and zsh split
      # every command the hook accepts exactly as its lexer does. BBS_REQUIRE_PS=1 and
      # BBS_REQUIRE_SHELLS=1 turn "not installed, skip" into a failure.
      - name: Install zsh (fill-gate shell differential)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: fill-gate hook parity and shell differential
        env:
          BBS_REQUIRE_PS: "1"
          BBS_REQUIRE_SHELLS: "1"
        run: |
          python3 plugins/bbs-sales/hooks/tests/fill_gate_parity.py | tail -25
          test "${PIPESTATUS[0]}" = "0"

      # The Windows bootstrap cannot be run here, but it can be parsed: a syntax error in it
      # stops every new Windows rep at step 1.
      - name: Parse the Windows bootstrap
        run: |
          pwsh -NoProfile -Command '
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/bbs-setup.ps1", [ref]$null, [ref]$e)
            if ($e.Count) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }
            "bbs-setup.ps1 parses"'

      # Anthropic's own validator, which knows the manifest schema our checker does not.
      # Errors fail the job: invalid JSON, a missing required field, a bad name, a relative
      # source with "..". Warnings are printed and do NOT fail it: an unknown key, an entry
      # version that plugin.json silently overrides, a plugin-root CLAUDE.md that never
      # loads. (`--strict` would block on warnings, but fails today on the bbs-claude-coach
      # name and bbs-marketing's CLAUDE.md, so it is not a drop-in.) The full output is kept
      # so the log says why it fired. It reads only files in this repo (no fetch, no
      # sign-in). Pinned to an exact CLI version so a new release cannot turn a green main
      # red overnight; move the pin on purpose.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: claude plugin validate (marketplace and every local plugin)
        run: |
          npm install --global --silent @anthropic-ai/claude-code@2.1.319
          claude plugin validate .
          for p in plugins/*/; do
            echo "== $p"
            claude plugin validate "$p"
          done

      # What each skill needs installed, printed on every run, so the "will this run on my
      # machine?" answer is in the PR rather than in someone's head.
      - name: What each skill requires
        run: python3 scripts/check_marketplace.py --requirements | tee /tmp/requirements.txt
        continue-on-error: true

      - name: Summarise
        if: always()
        run: |
          {
            if [ "${{ steps.check.outputs.code }}" = "0" ]; then
              echo "### ✅ Structural invariants — no FAIL"
            else
              echo "### ❌ Structural invariants — FAIL"
              echo
              echo "These are the defects that do not throw at runtime. They produce a"
              echo "plausible wrong number on a binding document instead."
            fi
            echo
            echo '```'
            cat /tmp/check.txt 2>/dev/null || echo "(checker produced no output)"
            echo '```'
            echo
            echo "### CLAUDE.md"
            echo '```'
            cat /tmp/claudemd.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            echo "<details><summary>What each skill requires installed</summary>"
            echo
            echo '```'
            cat /tmp/requirements.txt 2>/dev/null || echo "(no output)"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "Reproduce locally:"
            echo '```bash'
            echo "python3 scripts/check_marketplace.py"
            echo "python3 plugins/bbs-foundations/skills/bbs-claude-md-forge/scripts/check_claude_md.py \"\$PWD\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report
        run: |
          c=${{ steps.check.outputs.code }}
          m=${{ steps.claudemd.outputs.code }}
          echo "check_marketplace.py exit=$c · check_claude_md.py exit=$m"
          if [ "$c" != "0" ] || [ "$m" != "0" ]; then
            echo "::error::A structural invariant FAILED. See the job summary for the finding;"
            echo "::error::reproduce with the two commands at the bottom of it."
            exit 1
          fi

  # macOS reps run the Bash tool in zsh and use NFD file names: run the hook parity and the
  # bash/zsh differential there too (spec section 8). Windows is covered by merge gate V3.
  fill-gate-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The macOS runner image ships pwsh; fail loudly if it ever stops doing so.
      - name: PowerShell present
        run: command -v pwsh && pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
      - name: fill-gate hook parity and shell differential (macOS)
        env:
          BBS_REQUIRE_PS: "1"
          BBS_REQUIRE_SHELLS: "1"
        run: |
          python3 plugins/bbs-sales/hooks/tests/fill_gate_parity.py | tail -25
          test "${PIPESTATUS[0]}" = "0"
      - name: bbs-fill launcher tests (macOS)
        run: python3 plugins/bbs-sales/scripts/tests/test_bbs_fill.py
